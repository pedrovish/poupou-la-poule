<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Poupou et le gâteau surprise</title>
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div id="app"></div>
<script src="/assets/livre.js"></script>
<script>
// un mot écrit dans la scène
const titre = (txt, x, y, taille = 40, couleur = '#6B3A1E', rot = 0) =>
  `<g fill="${couleur}" font-family="Fredoka, sans-serif" font-weight="700" font-size="${taille}"><text x="${x}" y="${y}" text-anchor="middle"${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''}>${txt}</text></g>`;
// tout le monde enfariné : les couleurs pâlissent
const filtreFarine = `<defs><filter id="farine" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".45 0 0 0 .52  0 .45 0 0 .52  0 0 .45 0 .52  0 0 0 1 0"/></filter></defs>`;
const enfarine = svg => `<g filter="url(#farine)">${svg}</g>`;
// un gros nuage de farine
const nuageFarine = (x, y, e = 1) => `<g transform="translate(${x} ${y}) scale(${e})" fill="#fff" opacity=".82">` +
  `<circle cx="0" cy="0" r="62"/><circle cx="-74" cy="24" r="46"/><circle cx="76" cy="20" r="50"/><circle cx="-34" cy="-50" r="40"/><circle cx="44" cy="-52" r="38"/></g>`;
// des petits grains de farine
const grains = (n = 20, x0 = 160, l = 480, y0 = 90, h = 280) => {
  let s = '<g fill="#fff">';
  for (let i = 0; i < n; i++) s += `<circle cx="${x0 + (i * i * 37 + i * 191) % l}" cy="${y0 + (i * i * 23 + i * 113) % h}" r="${3 + i % 4}"/>`;
  return s + '</g>';
};
// la bonne odeur qui sort du four
const odeur = (x, y) => `<g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".85"><path d="M${x} ${y} q-14 -18 0 -36 q14 -18 0 -36"/><path d="M${x + 34} ${y - 10} q-12 -16 0 -30 q12 -14 0 -30"/></g>`;
// quelques feuilles d'automne au sol
const feuilles = () => u('feuille', 40, 500, 34, { rot: 20 }) + u('feuillerouge', 380, 520, 30, { rot: -30 }) + u('feuille', 700, 510, 32, { rot: 60 });
// les lucioles-bougies posées sur le gâteau (gâteau placé en x, y, largeur l)
const bougies = (x, y, l) => {
  const pos = [[.16, .18], [.34, -.01], [.50, -.03], [.66, -.01], [.84, .18]];
  return pos.map(([a, b], i) => u('luciole', x + a * l - l * .1, y + b * l, l * .2, { flip: i > 2 })).join('');
};
// les lucioles qui dansent dans la nuit
const danse = pos => pos.map(([x, y, l, f], i) => u('luciole', x, y, l, { flip: !!f })).join('');

lancerHistoire({
  numero: 7,
  titre: "Poupou et le gâteau surprise",
  morale: "Chacun donne un petit quelque chose… et ensemble, ça fait une grande fête !",
  couverture: () => decor('jour') + u('soleil', 640, 20, 110) + u('nuage', 60, 40, 170) +
    u('arbreautomne', 590, 110, 200) + u('guirlande', 40, 150, 520) +
    u('gateau', 320, 300, 260) + bougies(320, 300, 260) +
    u('poupou', 80, 270, 240) + u('souris', 590, 420, 120, { flip: true }) + feuilles(),
  fin: () => decor('nuit', u('lune', 722, 22, 66)) + u('etoile', 30, 150, 30) + u('etoile', 740, 240, 26) +
    u('guirlande', 90, 12, 620) + danse([[70, 200, 56], [230, 160, 46, 1], [540, 170, 50], [660, 170, 50, 1]]) +
    u('hamid', 320, 190, 170) + u('chapeau', 336, 168, 138) + u('souris', 382, 142, 60) +
    u('poupou', 120, 340, 170) + u('part', 280, 465, 70) +
    u('caramel', 475, 375, 170) + u('part', 440, 480, 64) + u('coincoin', 20, 410, 96) +
    u('mouton', 650, 365, 130, { flip: true }) + u('part', 675, 490, 62),
  pages: [
    {
      scene: () => decor('jour') + u('soleil', 30, 20, 100) + u('nuage', 240, 40, 160) +
        u('grange', 590, 130, 200) + u('hamid', 620, 215, 90) + u('chapeau', 628, 202, 74) + u('brouette', 690, 300, 100, { flip: true }) +
        u('arbreautomne', 10, 120, 150) + u('marguerite', 20, 215, 250) +
        u('caramel', 170, 385, 170) + u('poupou', 365, 320, 180) + u('coincoin', 555, 425, 90, { flip: true }) + feuilles() +
        bulle(470, 245, 'Chut !', 110),
      texte: "« <b>Chut !</b> C’est un secret ! » chuchota Poupou à ses amis. « Aujourd’hui, c’est l’<b>anniversaire de Papi Hamid</b>. Et si on lui faisait un gâteau surprise ? »"
    },
    {
      scene: () => decor('jour') + u('nuage', 500, 40, 170) + u('soleil', 40, 20, 90) +
        u('marguerite', 500, 170, 280, { flip: true }) + u('seau', 480, 360, 110) +
        u('poupou', 50, 300, 180) + u('oeuf', 240, 420, 62) +
        u('caramel', 295, 310, 170) + u('panier', 320, 430, 130) + u('pomme', 450, 300, 44) +
        bulle(372, 225, 'Miam !', 120),
      texte: "Chacun apporta ce qu’il avait : un bel <b>œuf</b> de Poupou, le bon <b>lait</b> de Marguerite, et les <b>pommes</b> de Caramel. « Une pour le gâteau… et une pour moi ! »"
    },
    {
      scene: () => decor('jour') + u('nuage', 40, 40, 170) +
        u('grange', 370, 20, 400) + u('sacfarine', 540, 90, 60) +
        u('poupou', 40, 310, 180) + u('caramel', 200, 350, 170) +
        titre('Oh non !', 180, 250, 54, '#C9427F', -5),
      texte: "Mais il manquait la <b>farine</b> ! Le gros sac était tout là-haut, dans le grenier de la grange. Poupou sautillait, Caramel s’étirait… Beaucoup trop haut !"
    },
    {
      scene: () => decor('jour') + u('nuage', 560, 30, 170) +
        u('grange', 450, 90, 320) +
        u('poupou', 90, 300, 210) +
        u('souris', 320, 370, 150) + u('coeur', 460, 370, 34, { rot: 12 }) +
        bulle(320, 280, 'Cric-cric !', 160),
      texte: "Cric-cric ! Une toute petite souris sortit d’un trou. « Je m’appelle <b>Noisette</b>. Moi, je connais un petit chemin pour monter au grenier ! »"
    },
    {
      scene: () => filtreFarine + decor('jour') + u('grange', 480, 60, 310) + u('souris', 594, 92, 66) +
        enfarine(u('poupou', 50, 300, 190) + u('caramel', 220, 360, 170) + u('coincoin', 395, 410, 90)) +
        u('sacfarine', 480, 370, 120, { rot: 20 }) +
        nuageFarine(370, 260, 1.45) + grains(30) +
        titre('POUF !', 370, 275, 74, '#C9427F', -6),
      texte: "Noisette poussa le sac : pousse, pousse… <b>POUF !</b> Quel nuage ! Poupou, Caramel et Coin-Coin étaient tout blancs. Atchoum ! Et tout le monde éclata de rire."
    },
    {
      scene: () => decor('jour') + u('nuage', 80, 30, 150) +
        u('four', 500, 200, 280) + odeur(640, 196) +
        u('hamid', 370, 210, 86) + u('chapeau', 377, 200, 72) + u('mouton', 430, 290, 90, { flip: true }) +
        u('poupou', 40, 290, 170) + u('saladier', 170, 390, 210) + u('souris', 330, 420, 100) +
        titre('Tourne, tourne !', 185, 200, 42, '#6B3A1E', -3) + feuilles(),
      texte: "Tourne, tourne, la cuillère ! Puis hop, le gâteau au <b>four</b> ! Ça sentait bon la pomme chaude. Pendant ce temps, <b>Flocon</b> occupait Papi Hamid : « Tu peux brosser mes boucles ? Toutes ! »"
    },
    {
      scene: () => decor('coucher', u('soleil', 340, 250, 160)) + u('etoile', 80, 60, 28) +
        u('gateau', 300, 320, 240) +
        u('poupou', 20, 310, 200) + u('caramel', 595, 355, 170, { flip: true }) + u('souris', 222, 450, 80) +
        bulle(560, 268, 'Pas de bougies !', 225) + u('coincoin', 540, 465, 66),
      texte: "Le soir venu, le gâteau était magnifique. « Oh non ! Pas de <b>bougies</b> ! » soupira Caramel. Poupou réfléchit… et courut vite à la mare : « <b>Lumi</b> ! On a besoin de toi ! »"
    },
    {
      scene: () => decor('nuit', u('lune', 650, 30, 80)) + u('etoile', 120, 40, 30) + u('etoile', 420, 70, 24) +
        u('guirlande', 60, 80, 540) +
        u('hamid', 590, 170, 160, { flip: true }) + u('chapeau', 604, 148, 132) +
        u('gateau', 265, 320, 240) + bougies(265, 320, 240) +
        u('poupou', 70, 340, 170) + u('souris', 215, 460, 66) + u('coincoin', 10, 430, 76) +
        u('caramel', 495, 425, 125) + u('mouton', 680, 400, 110, { flip: true }) +
        confettis(16) + titre('SURPRISE !', 290, 240, 60, '#FFF6C8', -4),
      texte: "Papi Hamid rentra. « Tiens, comme c’est calme… » Tout à coup, sur le gâteau, cinq petites lumières s’allumèrent. « <b>SURPRISE !</b> Joyeux anniversaire, Papi Hamid ! »"
    },
    {
      scene: () => decor('nuit', u('lune', 640, 30, 80)) + u('etoile', 80, 40, 30) +
        u('guirlande', 60, 80, 540) +
        danse([[230, 130, 50], [130, 210, 44, 1], [400, 90, 46], [700, 130, 50, 1], [710, 250, 44]]) +
        u('hamid', 480, 170, 180, { flip: true }) + u('chapeau', 495, 148, 150) +
        u('gateau', 240, 320, 240) + `<g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"><path d="M475 280 h-54 M470 305 h-40 M478 255 h-34"/></g>` +
        u('poupou', 40, 340, 180) + u('souris', 605, 440, 80) + u('coincoin', 695, 435, 90, { flip: true }) +
        titre('Pffff !', 330, 245, 48, '#FFF6C8', -6),
      texte: "« Souffle, Papi ! » <b>Pfffff !</b> Les lucioles s’envolèrent et dansèrent autour de lui. Papi Hamid riait, tout ému. Et chacun eut sa part de gâteau, même la petite Noisette !"
    }
  ]
});
</script>
</body>
</html>
