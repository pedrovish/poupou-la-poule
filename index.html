<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les aventures de Poupou la poule</title>
<meta name="description" content="Une nouvelle histoire illustrée de Poupou la poule chaque jour.">
<link rel="icon" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<div class="accueil">
  <header class="entete">
    <svg viewBox="0 0 300 220" aria-hidden="true">
      <use href="/assets/personnages.svg#soleil" x="210" y="0" width="80" height="80"/>
      <use href="/assets/personnages.svg#fleur" x="20" y="150" width="30" height="45"/>
      <use href="/assets/personnages.svg#fleur" x="250" y="160" width="26" height="39"/>
      <use href="/assets/personnages.svg#poupou" x="55" y="20" width="190" height="190"/>
    </svg>
    <h1>Les aventures de Poupou</h1>
    <p>La petite poule au foulard bleu · une nouvelle histoire chaque jour</p>
  </header>

  <h2 class="titre-section">📚 Mes histoires</h2>
  <div id="grille" class="grille"><p class="vide">Chargement des histoires…</p></div>

  <p class="pied">Fait avec amour pour une petite lectrice de 5 ans 💛</p>
</div>

<script>
const S = '/assets/personnages.svg';
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function dateFr(d) { const [a, m, j] = d.split('-').map(Number); return `${j} ${MOIS[m - 1]} ${a}`; }
function vignette(h) {
  const obj = h.objet ? `<use href="${S}#${h.objet}" x="212" y="22" width="72" height="72"/>` : '';
  return `<svg viewBox="0 0 300 190" aria-hidden="true">
    <rect width="300" height="190" fill="${h.couleur || '#BFE6FF'}"/>
    <path d="M0 140 C80 120 200 150 300 128 L300 190 L0 190Z" fill="#9BD36A"/>
    <path d="M0 165 C100 150 200 172 300 158 L300 190 L0 190Z" fill="#7CC24F"/>
    ${obj}
    <use href="${S}#poupou" x="70" y="40" width="140" height="140"/>
  </svg>`;
}
fetch('/histoires.json', { cache: 'no-store' }).then(r => r.json()).then(liste => {
  liste.sort((a, b) => b.numero - a.numero);
  const g = document.getElementById('grille');
  if (!liste.length) { g.innerHTML = '<p class="vide">La première histoire arrive bientôt !</p>'; return; }
  g.innerHTML = liste.map((h, k) => `
    <a class="carte" href="${h.fichier}">
      ${k === 0 ? '<span class="badge">Nouvelle !</span>' : ''}
      ${vignette(h)}
      <div class="infos">
        <div class="num">Histoire n°${h.numero} · ${dateFr(h.date)}</div>
        <h3>${h.titre}</h3>
        <p class="resume">${h.resume}</p>
      </div>
    </a>`).join('');
}).catch(() => { document.getElementById('grille').innerHTML = '<p class="vide">Oups, impossible de charger les histoires.</p>'; });
</script>
</body>
</html>
